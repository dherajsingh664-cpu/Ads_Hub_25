<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads_Hub_25</title><style>body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;margin:0;padding:12px}h1{color:#00ff88}.card{background:#1e1e1e;border-radius:15px;padding:18px;margin:14px auto;max-width:400px;border:1px solid #00ff88}button{background:#00ff88;color:#000;border:none;padding:12px;border-radius:25px;font-weight:bold;width:100%;margin:6px 0}input{width:90%;padding:12px;border-radius:10px;border:none;margin:8px 0}.ad{background:#2a2a2a;padding:15px;border-radius:10px;margin:12px 0}#wheel{width:120px;height:120px;border-radius:50%;border:7px solid #00ff88;margin:10px auto;background:conic-gradient(#00ff88 0 60deg,#222 60deg 120deg,#00cc6a 120deg 180deg,#2a2a2a 180deg 240deg,#00ff88 240deg 300deg,#1a1a1a 300deg 360deg);display:flex;align-items:center;justify-content:center;transition:3s}</style></head><body>
<h1>🚀 Ads_Hub_25</h1>
<div class="card"><h2>Balance: ₹<span id="bal">10</span></h2><p>Taps: <span id="t">0</span></p><div style="font-size:55px" onclick="taps++;document.getElementById('t').innerText=taps;if(taps%10==0){b+=5;save()}">💰</div><p>10 Taps = ₹5</p><div class="ad">Yaha Ad Aayega - Monetag ID Lagana Hai</div></div>
<div class="card"><h3>🎡 Spin & Win ₹50 Tak</h3><div id="wheel">SPIN</div><button onclick="let w=document.getElementById('wheel');w.style.transform='rotate('+(Math.random()*360+1800)+'deg)';setTimeout(()=>{let p=[0,5,10,20,50][Math.floor(Math.random()*5)];document.getElementById('sr').innerText=p==0?'Try Again':'Jeete ₹'+p;if(p){b+=p;save()}},3000)">SPIN KARO</button><p id="sr"></p></div>
<div class="card"><h3>💳 Withdraw</h3><p>Min ₹100</p><input id="upi" placeholder="Apna UPI ID likho"><input id="amt" type="number" placeholder="Kitna nikalna hai - 100"><button style="background:#ffcc00" onclick="let u=document.getElementById('upi').value;let a=parseInt(document.getElementById('amt').value);if(!u||!a)return alert('UPI aur Amount likho');if(a<100)return alert('Min 100');if(a>b)return alert('Balance kam hai');b-=a;save();document.getElementById('wmsg').innerText='Request bhej diya! 24 ghante me '+u+' pe aa jayega';">WITHDRAW KARO</button><p id="wmsg" style="color:#00ff88"></p></div>
<script>let b=parseInt(localStorage.getItem('b')||10);let taps=0;function save(){document.getElementById('bal').innerText=b;localStorage.setItem('b',b)}save();</script>
</body></html>
