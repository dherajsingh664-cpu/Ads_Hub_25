
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ads_Hub_25 - Delhi Bet</title>
<style>
body{background:#0a1a0a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:15px}
.card{background:#152b15;padding:20px;border-radius:15px;margin:10px 0;border:1px solid #2ecc71}
h1{color:#2ecc71}
button{padding:14px 30px;border:none;border-radius:10px;font-weight:bold;margin:6px;cursor:pointer;font-size:17px}
.red{background:#e74c3c;color:#fff}.green{background:#2ecc71;color:#fff}.blue{background:#3498db;color:#fff;width:90%}
.coin{font-size:22px;color:gold}
input{padding:12px;border-radius:8px;border:none;width:85%;margin:10px}
</style>
</head>
<body>
<h1>🇮🇳 Ads_Hub_25</h1>
<h3 style="color:#aaa">Delhi Colour Bet Game</h3>
<div class="card">
<p class="coin">💰 Coins: <span id="coins">1000</span></p>
<p>100 Coins ka Bet Lagao!</p>
<button class="red" onclick="bet('red')">RED x2</button>
<button class="green" onclick="bet('green')">GREEN x2</button>
<p id="result" style="font-size:18px;margin-top:15px;font-weight:bold"></p>
</div>
<div class="card">
<h3>Withdraw - 1000 Coins = 100 Rs</h3>
<input id="upi" placeholder="Apna UPI ID likho - ex: xyz@upi">
<button class="blue" onclick="withdraw()">WhatsApp Pe Withdraw Mango</button>
<p style="font-size:11px;color:#aaa">Payment aapke number pe 24hr me ayega</p>
</div>
<script>
let coins = parseInt(localStorage.getItem('coins')||'1000');
document.getElementById('coins').innerText=coins;
function bet(color){
 if(coins<100){alert('Coins kam hai!');return;}
 coins-=100;
 let win = Math.random()>0.5?'red':'green';
 let el=document.getElementById('result');
 if(color===win){coins+=200; el.innerHTML='✅ '+win.toUpperCase()+' AAYA! +200 Jeete'; el.style.color='#2ecc71';}
 else{ el.innerHTML='❌ '+win.toUpperCase()+' AAYA! Haar gaye'; el.style.color='#e74c3c';}
 localStorage.setItem('coins',coins);
 document.getElementById('coins').innerText=coins;
}
function withdraw(){
 let upi=document.getElementById('upi').value;
 if(!upi){alert('Pehle UPI ID likho');return;}
 if(coins<1000){alert('1000 Coins chahiye');return;}
 let num="917051380755";
 let msg=`Hi Owner, Mujhe Withdraw Chahiye%0ACoins: ${coins}%0AAmount: 100 Rs%0AUPI: ${upi}`;
 window.open(`https://wa.me/${num}?text=${msg}`,'_blank');
}
</script>
</body>
</html>
