<div style="background:#111;padding:10px;margin:10px;border-radius:10px;border:1px dashed gold">
<h4 style="margin:0;color:gold">🔑 ADMIN PANEL (Sirf aapke liye)</h4>
<input id="addCoin" placeholder="Kitne coins add karne hai?" style="padding:8px;width:60%">
<button onclick="addCoins()" style="padding:8px;background:gold;font-weight:bold">Add Coins</button>
<p style="font-size:12px;color:#aaa">Deposit aane ke baad yaha se coins add karo. Ex: 100rs = 100 coins</p>
</div>
<script>
function addCoins(){
 let c = parseInt(document.getElementById('addCoin').value);
 if(!c) return;
 balance+=c; localStorage.setItem('lotto_bal',balance);
 document.getElementById('bal').innerText='₹'+balance;
 alert(c+' Coins Add Ho Gaye!');
}
</script>
