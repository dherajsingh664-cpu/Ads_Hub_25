
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTOWIN.GO</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#4d8cff;font-family:Arial;padding-bottom:70px}
.top{height:56px;background:linear-gradient(90deg,#7c5cff,#a48bff);display:flex;justify-content:space-between;align-items:center;padding:0 12px;position:sticky;top:0}
.logo{font-weight:900;font-size:22px;color:#fff} .logo i{color:#ffeb3b;font-style:normal}
.wallet{background:#222;border:2px solid gold;border-radius:30px;padding:4px 8px 4px 12px;display:flex;gap:6px;align-items:center}
.wallet b{color:#ffeb3b}
.hscroll{display:flex;gap:10px;overflow:auto;padding:10px}
.gcard{min-width:115px;height:145px;border-radius:16px;border:3px solid gold;display:flex;flex-direction:column;justify-content:end;padding:8px;font-weight:900}
.filter{background:#658dff;display:flex;gap:8px;padding:8px;overflow:auto}
.chip{padding:7px 14px;border-radius:20px;background:#416dff;color:#fff;white-space:nowrap}
.chip.on{background:#00d06c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.bcard{height:150px;border-radius:16px;padding:10px;font-weight:900;font-size:18px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:60px;background:#e6f7ff;display:flex}
.bottom div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.on{color:#00b050;background:#c8f5dd}
</style>
</head>
<body>
<div class="top"><div class="logo">LOTTO<i>WIN</i>.GO</div><div class="wallet">🪙 <b id="bal">₹5</b></div></div>

<div style="padding:10px;font-weight:800">Recently</div>
<div class="hscroll">
<div class="gcard" style="background:#222;color:gold" onclick="play('Chicken Rocket')">CHICKEN ROCKET</div>
<div class="gcard" style="background:linear-gradient(#000,#fc0)" onclick="play('Aviator')">✈️ AVIATOR</div>
<div class="gcard" style="background:#900;color:#fff" onclick="play('Andar Bahar')">ANDAR BAHAR</div>
<div class="gcard" style="background:#1a1a3a;color:#fff" onclick="play('Mi Mines')">Mi Mines</div>
</div>

<div class="filter"><div class="chip on">ALL</div><div class="chip">Most Popular</div><div class="chip">LottoWin</div><div class="chip">Top 10</div></div>

<div class="grid">
<div class="bcard" style="background:linear-gradient(#200,#f00);color:#f66" onclick="play('Aviator')">✈️ AVIATOR<br><small style="color:#fff">SPRIBE</small></div>
<div class="bcard" style="background:linear-gradient(#7ad7ff,#0057ff)" onclick="play('Ice Fishing')">ICE FISHING</div>
<div class="bcard" style="background:#ff1d5a" onclick="play('Astronaut')">ASTRONAUT</div>
<div class="bcard" style="background:linear-gradient(#0a4a00,#3cff00)" onclick="play('Super Ace')">Super Ace</div>
</div>

<div style="background:#111;padding:10px;margin:10px;border-radius:10px;border:1px dashed gold">
<b style="color:gold">🔑 ADMIN PANEL (Sirf aapke liye)</b><br><br>
<input id="addCoin" placeholder="Kitne coins add karne hai?" style="padding:8px;width:65%">
<button onclick="addCoins()" style="padding:8px;background:gold;font-weight:bold">Add Coins</button>
<div style="color:#aaa;font-size:11px;margin-top:5px">Deposit aane ke baad yaha se coins add karo</div>
</div>

<div class="bottom"><div>🏠<br>Home</div><div class="on">🎮<br>Game</div><div>💳<br>Deposit</div><div>🎥<br>Live</div><div>👤<br>Profile</div></div>

<script>
let balance = parseInt(localStorage.getItem('lotto_bal')||'5');
document.getElementById('bal').innerText='₹'+balance;
function play(g){
 let amt=prompt(g+" me bet? Balance ₹"+balance,"10");
 if(!amt) return; amt=parseInt(amt);
 if(amt>balance){alert('Balance kam hai');return}
 balance-=amt;
 if(Math.random()>0.4){ let w=Math.floor(amt*2); balance+=w; alert('WIN ₹'+w); }
 else{ alert('LOSS ₹'+amt); }
 localStorage.setItem('lotto_bal',balance);
 document.getElementById('bal').innerText='₹'+balance;
}
function addCoins(){
 let c=parseInt(document.getElementById('addCoin').value);
 if(!c) return; balance+=c; localStorage.setItem('lotto_bal',balance);
 document.getElementById('bal').innerText='₹'+balance; alert(c+' Coins Add Ho Gaye');
}
</script>
</body>
</html>
